<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>策略信号审计查看器</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f4efe5;
      --panel: rgba(255, 252, 246, 0.96);
      --panel-strong: #fffaf0;
      --ink: #1e2430;
      --muted: #667085;
      --accent: #0e7490;
      --accent-soft: rgba(14, 116, 144, 0.12);
      --up: #c2410c;
      --down: #1d4ed8;
      --green: #15803d;
      --red: #b91c1c;
      --line: rgba(30, 36, 48, 0.08);
      --shadow: 0 22px 50px rgba(75, 85, 99, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(14, 116, 144, 0.12), transparent 28%),
        radial-gradient(circle at 90% 0%, rgba(194, 65, 12, 0.14), transparent 26%),
        linear-gradient(180deg, #f9f5ee 0%, #f1ebe2 100%);
      min-height: 100vh;
    }

    .layout {
      width: min(1660px, calc(100vw - 32px));
      margin: 18px auto 28px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 18px;
      position: sticky;
      top: 14px;
      height: fit-content;
    }

    .main {
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.15;
    }

    .subtitle,
    .hint,
    .meta-line {
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    select,
    input[type="text"],
    input[type="file"] {
      width: 100%;
      border: 1px solid rgba(30, 36, 48, 0.12);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    .ghost {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 18px;
    }

    .stat-card {
      padding: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(250,247,241,0.9));
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .chart-panel {
      padding: 14px;
    }

    #chart {
      width: 100%;
      height: 720px;
    }

    .tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .table-panel {
      padding: 16px;
      overflow: hidden;
    }

    .table-wrap {
      max-height: 340px;
      overflow: auto;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #fdf8ef;
      z-index: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(30, 36, 48, 0.06);
      color: var(--ink);
    }

    .pill.pool {
      background: rgba(21, 128, 61, 0.14);
      color: var(--green);
    }

    .pill.non-pool {
      background: rgba(102, 112, 133, 0.13);
      color: #475467;
    }

    .legend-note {
      display: grid;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    @media (max-width: 1280px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @media (max-width: 960px) {
      .stats,
      .tables {
        grid-template-columns: 1fr;
      }

      #chart {
        height: 620px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel sidebar">
      <h1>策略信号审计查看器</h1>
      <div class="subtitle">按单品种核实 A 通道信号、池子 A 入选结果，以及平仓是否都建立在已有开仓之上。</div>
      <div class="controls">
        <div class="control-group">
          <label for="dataUrl">JSON 路径</label>
          <input id="dataUrl" type="text" value="../artifacts/data/signal_audit_full.json" />
        </div>
        <div class="control-group">
          <button id="loadRemoteBtn">加载 JSON</button>
          <button id="loadLocalBtn" class="ghost">选择本地 JSON</button>
          <input id="fileInput" type="file" accept=".json,application/json" hidden />
        </div>
        <div class="control-group">
          <label for="varietySelect">品种</label>
          <select id="varietySelect"></select>
        </div>
        <div class="control-group">
          <label for="searchInput">品种筛选</label>
          <input id="searchInput" type="text" placeholder="输入品种名过滤" />
        </div>
        <div class="checkbox-row">
          <input id="poolOnlyCheckbox" type="checkbox" />
          <label for="poolOnlyCheckbox">只看池子 A</label>
        </div>
      </div>
      <div id="metaBlock" class="status">等待加载数据。</div>
      <div class="legend-note">
        <div>图例约定：</div>
        <div>红三角：原始开多；蓝倒三角：原始开空</div>
        <div>红菱形：原始平多；蓝菱形：原始平空</div>
        <div>绿圆：池子 A 实际开仓；深红圆：池子 A 实际平仓</div>
        <div>黄方块：池子 A 信号被拒</div>
      </div>
    </aside>

    <main class="main">
      <section class="panel stats">
        <div class="stat-card">
          <div class="stat-label">原始开仓信号</div>
          <div id="rawSignalCount" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">池子 A 选中次数</div>
          <div id="poolSelectedCount" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">池子 A 拒绝次数</div>
          <div id="poolRejectedCount" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">原始平仓信号</div>
          <div id="rawExitCount" class="stat-value">-</div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div id="chart"></div>
      </section>

      <section class="tables">
        <div class="panel table-panel">
          <div id="varietyTitle" class="meta-line"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  <th>决策</th>
                  <th>原因</th>
                  <th>方向</th>
                  <th>收盘价</th>
                  <th>主力分位</th>
                </tr>
              </thead>
              <tbody id="decisionBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel table-panel">
          <div class="meta-line">单品种信号历史表现</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>开仓日</th>
                  <th>平仓日</th>
                  <th>方向</th>
                  <th>持有天数</th>
                  <th>收益率</th>
                  <th>原因</th>
                </tr>
              </thead>
              <tbody id="tradeBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      payload: null,
      filteredVarieties: [],
      currentVariety: null,
      chart: null,
    };

    const dom = {
      dataUrl: document.getElementById("dataUrl"),
      loadRemoteBtn: document.getElementById("loadRemoteBtn"),
      loadLocalBtn: document.getElementById("loadLocalBtn"),
      fileInput: document.getElementById("fileInput"),
      varietySelect: document.getElementById("varietySelect"),
      searchInput: document.getElementById("searchInput"),
      poolOnlyCheckbox: document.getElementById("poolOnlyCheckbox"),
      metaBlock: document.getElementById("metaBlock"),
      rawSignalCount: document.getElementById("rawSignalCount"),
      poolSelectedCount: document.getElementById("poolSelectedCount"),
      poolRejectedCount: document.getElementById("poolRejectedCount"),
      rawExitCount: document.getElementById("rawExitCount"),
      decisionBody: document.getElementById("decisionBody"),
      tradeBody: document.getElementById("tradeBody"),
      varietyTitle: document.getElementById("varietyTitle"),
    };

    function fmtNum(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      return Number(value).toFixed(digits);
    }

    function fmtPct(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      return `${(Number(value) * 100).toFixed(2)}%`;
    }

    function isPoolVariety(name) {
      const variety = state.payload?.varieties?.[name];
      return Boolean(variety?.in_pool_a);
    }

    function rebuildVarietyOptions(preferredName) {
      if (!state.payload) return;
      const keyword = dom.searchInput.value.trim();
      const poolOnly = dom.poolOnlyCheckbox.checked;
      const allNames = state.payload.variety_order.filter((name) => {
        if (poolOnly && !isPoolVariety(name)) return false;
        if (!keyword) return true;
        return name.includes(keyword);
      });
      state.filteredVarieties = allNames;
      dom.varietySelect.innerHTML = allNames
        .map((name) => `<option value="${name}">${name}</option>`)
        .join("");
      const next = preferredName && allNames.includes(preferredName) ? preferredName : allNames[0];
      if (next) {
        dom.varietySelect.value = next;
        renderVariety(next);
      }
    }

    function buildScatter(rows, predicate, valueKey = "close", extra = {}) {
      return rows
        .filter(predicate)
        .map((row) => ({
          name: row.date,
          value: [row.date, row[valueKey]],
          ...extra,
        }));
    }

    function calcAxisRange(values, paddingRatio = 0.04) {
      const numericValues = values
        .map((value) => Number(value))
        .filter((value) => Number.isFinite(value));

      if (!numericValues.length) {
        return { min: null, max: null };
      }

      let min = Math.min(...numericValues);
      let max = Math.max(...numericValues);
      let span = max - min;

      if (span === 0) {
        span = Math.max(Math.abs(max) * 0.02, 1);
        min -= span;
        max += span;
      } else {
        const padding = span * paddingRatio;
        min -= padding;
        max += padding;
      }

      return {
        min: Number(min.toFixed(4)),
        max: Number(max.toFixed(4)),
      };
    }

    function renderChart(name, variety) {
      const rows = variety.rows;
      const dates = rows.map((row) => row.date);
      const close = rows.map((row) => row.close);
      const main = rows.map((row) => row.main_force);
      const retail = rows.map((row) => row.retail);

      const rawLongPoints = buildScatter(rows, (row) => row.raw_open_long);
      const rawShortPoints = buildScatter(rows, (row) => row.raw_open_short);
      const rawCloseLongPoints = buildScatter(rows, (row) => row.raw_close_long);
      const rawCloseShortPoints = buildScatter(rows, (row) => row.raw_close_short);
      const poolSelectedPoints = buildScatter(
        rows,
        (row) => row.pool_decision === "selected",
      );
      const poolRejectedPoints = buildScatter(
        rows,
        (row) => row.pool_decision === "rejected" && row.pool_decision_reason !== "not_in_pool_a",
      );

      const poolExitPoints = variety.pool_a.events
        .filter((event) => event.event_type === "trade_exit")
        .map((event) => ({
          name: event.date,
          value: [event.date, event.price],
        }));

      const priceAxisRange = calcAxisRange([
        ...close,
        ...poolExitPoints.map((point) => point.value[1]),
      ]);
      const sentimentAxisRange = calcAxisRange([...main, ...retail], 0.08);

      const option = {
        animation: false,
        backgroundColor: "transparent",
        legend: {
          top: 10,
          textStyle: { color: "#475467" },
          data: [
            "收盘价",
            "主力指数",
            "散户指数",
            "原始开多",
            "原始开空",
            "原始平多",
            "原始平空",
            "池子A开仓",
            "池子A平仓",
            "池子A拒绝",
          ],
        },
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          confine: true,
        },
        axisPointer: {
          link: [{ xAxisIndex: "all" }],
        },
        grid: [
          { left: 56, right: 28, top: 60, height: 290 },
          { left: 56, right: 28, top: 410, height: 230 },
        ],
        xAxis: [
          {
            type: "category",
            data: dates,
            boundaryGap: false,
            axisLabel: { color: "#667085", interval: 19 },
          },
          {
            type: "category",
            data: dates,
            boundaryGap: false,
            gridIndex: 1,
            axisLabel: { color: "#667085", interval: 19 },
          },
        ],
        yAxis: [
          {
            type: "value",
            name: "收盘价",
            scale: true,
            min: priceAxisRange.min,
            max: priceAxisRange.max,
            axisLabel: { color: "#667085" },
            splitLine: { lineStyle: { color: "rgba(30,36,48,0.08)" } },
          },
          {
            type: "value",
            name: "主/散指数",
            gridIndex: 1,
            scale: true,
            min: sentimentAxisRange.min,
            max: sentimentAxisRange.max,
            axisLabel: { color: "#667085" },
            splitLine: { lineStyle: { color: "rgba(30,36,48,0.08)" } },
          },
        ],
        dataZoom: [
          { type: "inside", xAxisIndex: [0, 1], start: 0, end: 100 },
          { type: "slider", xAxisIndex: [0, 1], bottom: 12, height: 20 },
        ],
        series: [
          {
            name: "收盘价",
            type: "line",
            smooth: false,
            symbol: "none",
            lineStyle: { width: 2.2, color: "#1f2937" },
            data: close,
          },
          {
            name: "主力指数",
            type: "line",
            xAxisIndex: 1,
            yAxisIndex: 1,
            symbol: "none",
            lineStyle: { width: 2, color: "#0e7490" },
            data: main,
          },
          {
            name: "散户指数",
            type: "line",
            xAxisIndex: 1,
            yAxisIndex: 1,
            symbol: "none",
            lineStyle: { width: 1.7, color: "#9a3412", type: "dashed" },
            data: retail,
          },
          {
            name: "原始开多",
            type: "scatter",
            symbol: "triangle",
            symbolSize: 11,
            itemStyle: { color: "#dc2626" },
            data: rawLongPoints,
          },
          {
            name: "原始开空",
            type: "scatter",
            symbol: "triangle",
            symbolRotate: 180,
            symbolSize: 11,
            itemStyle: { color: "#2563eb" },
            data: rawShortPoints,
          },
          {
            name: "原始平多",
            type: "scatter",
            symbol: "diamond",
            symbolSize: 12,
            itemStyle: { color: "#dc2626", borderColor: "#7f1d1d", borderWidth: 1 },
            data: rawCloseLongPoints,
          },
          {
            name: "原始平空",
            type: "scatter",
            symbol: "diamond",
            symbolSize: 12,
            itemStyle: { color: "#2563eb", borderColor: "#1e3a8a", borderWidth: 1 },
            data: rawCloseShortPoints,
          },
          {
            name: "池子A开仓",
            type: "scatter",
            symbol: "circle",
            symbolSize: 12,
            itemStyle: { color: "#16a34a", borderColor: "#14532d", borderWidth: 1 },
            data: poolSelectedPoints,
          },
          {
            name: "池子A平仓",
            type: "scatter",
            symbol: "circle",
            symbolSize: 12,
            itemStyle: { color: "#ef4444", borderColor: "#7f1d1d", borderWidth: 1 },
            data: poolExitPoints,
          },
          {
            name: "池子A拒绝",
            type: "scatter",
            symbol: "rect",
            symbolSize: 11,
            itemStyle: { color: "#d97706" },
            data: poolRejectedPoints,
          },
        ],
      };

      state.chart.setOption(option, true);
    }

    function renderDecisions(variety) {
      const decisions = variety.pool_a.decisions.slice().reverse();
      dom.decisionBody.innerHTML = decisions.length
        ? decisions
            .map((item) => `
              <tr>
                <td>${item.date}</td>
                <td>${item.decision}</td>
                <td>${item.reason}</td>
                <td>${item.side || "-"}</td>
                <td>${fmtNum(item.price, 2)}</td>
                <td>${fmtNum(item.main_score, 2)}</td>
              </tr>
            `)
            .join("")
        : `<tr><td colspan="6">该品种没有池子 A 决策记录。</td></tr>`;
    }

    function renderTrades(variety) {
      const trades = variety.single_variety.trades.slice().reverse();
      dom.tradeBody.innerHTML = trades.length
        ? trades
            .map((trade) => `
              <tr>
                <td>${trade.entry_date}</td>
                <td>${trade.exit_date}</td>
                <td>${trade.side}</td>
                <td>${trade.holding_days}</td>
                <td>${fmtPct(trade.pnl_ratio)}</td>
                <td>${trade.exit_reason}</td>
              </tr>
            `)
            .join("")
        : `<tr><td colspan="6">该品种没有单品种交易记录。</td></tr>`;
    }

    function renderStats(name, variety) {
      const singleSummary = variety.single_variety.summary;
      const poolSummary = variety.pool_a.summary;
      dom.rawSignalCount.textContent =
        singleSummary.raw_open_long_count + singleSummary.raw_open_short_count;
      dom.poolSelectedCount.textContent = poolSummary.pool_selected_signal_count;
      dom.poolRejectedCount.textContent = poolSummary.pool_rejected_signal_count;
      dom.rawExitCount.textContent =
        singleSummary.raw_close_long_count + singleSummary.raw_close_short_count;

      const pill = variety.in_pool_a
        ? '<span class="pill pool">池子 A</span>'
        : '<span class="pill non-pool">非池子 A</span>';
      dom.varietyTitle.innerHTML = `${pill} ${name} / ${variety.sector} / key=${variety.key}`;
    }

    function renderVariety(name) {
      if (!state.payload) return;
      state.currentVariety = name;
      const variety = state.payload.varieties[name];
      renderStats(name, variety);
      renderChart(name, variety);
      renderDecisions(variety);
      renderTrades(variety);
    }

    function renderMeta() {
      const meta = state.payload.meta;
      dom.metaBlock.innerHTML = `
        <div class="meta-line">区间：${meta.trade_date_start} ～ ${meta.trade_date_end}</div>
        <div class="meta-line">交易日：${meta.trade_date_count} 天</div>
        <div class="meta-line">品种：${meta.variety_count} 个；池子 A：${meta.pool_a_count} 个</div>
        <div class="meta-line">规则：A 通道严格 5+3 开仓，主力 3 日拐头平仓，平仓当日禁止反手</div>
      `;
    }

    function loadPayload(payload) {
      state.payload = payload;
      renderMeta();
      rebuildVarietyOptions(state.currentVariety);
    }

    async function loadFromUrl() {
      const url = dom.dataUrl.value.trim();
      if (!url) return;
      dom.metaBlock.textContent = "正在加载 JSON...";
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`加载失败：${response.status} ${response.statusText}`);
      }
      const payload = await response.json();
      loadPayload(payload);
    }

    dom.loadRemoteBtn.addEventListener("click", async () => {
      try {
        await loadFromUrl();
      } catch (error) {
        dom.metaBlock.textContent = `${error.message}。如果你是直接双击 HTML 打开，请改用本地文件选择或本地静态服务。`;
      }
    });

    dom.loadLocalBtn.addEventListener("click", () => dom.fileInput.click());

    dom.fileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const text = await file.text();
      loadPayload(JSON.parse(text));
    });

    dom.varietySelect.addEventListener("change", (event) => {
      renderVariety(event.target.value);
    });

    dom.searchInput.addEventListener("input", () => {
      rebuildVarietyOptions(state.currentVariety);
    });

    dom.poolOnlyCheckbox.addEventListener("change", () => {
      rebuildVarietyOptions(state.currentVariety);
    });

    window.addEventListener("resize", () => {
      if (state.chart) state.chart.resize();
    });

    state.chart = echarts.init(document.getElementById("chart"));
    loadFromUrl().catch(() => {
      dom.metaBlock.textContent = "默认路径未加载成功，可以直接选择本地 JSON 文件。";
    });
  </script>
</body>
</html>
